name: Update GogginsTube

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gogginstube-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests youtube-transcript-api

      - name: Check the code has no typos
        run: python -m py_compile pipeline.py

      - name: Fetch new videos and papers
        run: python pipeline.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      - name: Save results
        run: |
          git config user.name "gogginstube-bot"
          git config user.email "gogginstube-bot@users.noreply.github.com"
          git add site/
          git diff --staged --quiet || (git commit -m "Update videos and papers" && git pull --rebase && git push)
