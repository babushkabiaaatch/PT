# Runs the pipeline in the cloud every day, so you never need your laptop.
name: Update GogginsTube

on:
  schedule:
    - cron: "0 3 * * *"    # every day at 03:00 UTC. Change the numbers to change the time.
  workflow_dispatch:        # gives you a "Run workflow" button for running it by hand

permissions:
  contents: write           # lets the job save the new videos back into your repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch new videos and papers
        run: python pipeline.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save results
        run: |
          git config user.name "gogginstube-bot"
          git config user.email "gogginstube-bot@users.noreply.github.com"
          git add site/
          git diff --staged --quiet || (git commit -m "Update videos and papers" && git push)
